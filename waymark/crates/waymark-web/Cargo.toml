[package]
name = "waymark-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Read-only Web service and development launcher for Waymark"

[lib]
name = "waymark_web"
path = "src/lib.rs"

[[bin]]
name = "waymark-web-dev"
path = "src/bin/waymark-web-dev.rs"

[[bin]]
name = "waymark-web-manifest"
path = "src/bin/waymark-web-manifest.rs"

[features]
default = []
# Embed the built frontend (and its provenance manifest) in the binary. Off by
# default so an ordinary `cargo build`/`cargo test` needs no frontend on disk and
# no npm; the release pipeline builds the frontend first, then toggles this.
embed = []

[dependencies]
waymark-core = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
pulldown-cmark = { workspace = true }
ammonia = { workspace = true }
# MSRV pin: idna_adapter 1.2.2 pulls icu 2.x (rust-version 1.88). 1.2.0 resolves
# the icu 1.5 line, whose declared MSRV is within the workspace's 1.85.
idna_adapter = "=1.2.0"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
camino = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }

[build-dependencies]
# The build script shares `src/manifest.rs` with the library, so the tree walk
# and the manifest shape have exactly one implementation.
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
