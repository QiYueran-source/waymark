[package]
name = "waymark-mcp"
description = "Waymark MCP adapter over the shared domain library"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "waymark-mcp"
path = "src/main.rs"

[dependencies]
waymark-core.workspace = true
rmcp.workspace = true
schemars.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
camino.workspace = true

[dev-dependencies]
# The client half of rmcp is only needed by the in-process test harness; cargo
# unifies this feature into the test build without putting it in the binary.
rmcp = { version = "0.8", features = ["transport-io", "client"] }
tempfile.workspace = true
