[workspace]
resolver = "2"
members = [
    "crates/waymark-core",
    "crates/waymark-cli",
    "crates/waymark-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/frank/waymark"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
sha2 = "0.10"
fd-lock = "4"
tempfile = "3"
camino = { version = "1", features = ["serde1"] }
thiserror = "2"
libc = "0.2"
getrandom = "0.2"
serde_norway = "0.9"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"

waymark-core = { path = "crates/waymark-core" }
waymark-web = { path = "crates/waymark-web" }

[profile.release]
lto = "thin"
