<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none" role="img" aria-labelledby="title">
  <title id="title">waymark — local-first work tracking for humans and agents</title>
  <defs>
    <radialGradient id="glow" cx="0.22" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#1E2735"/>
      <stop offset="1" stop-color="#0B0D11"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D2E0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A5B"/>
      <stop offset="1" stop-color="#E8542F"/>
    </linearGradient>
  </defs>

  <!-- Everything between y=120 and y=520 is the README banner crop. Keep
       content inside it so a 1280x400 cut loses nothing. -->
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- topographic contours -->
  <g stroke="#7C93B0" stroke-width="1" opacity="0.10" transform="translate(0 120)">
    <path d="M760 430 C 830 300, 980 330, 1010 240 C 1040 150, 960 90, 1020 10"/>
    <path d="M800 440 C 872 306, 1016 336, 1046 246 C 1076 156, 998 96, 1058 14"/>
    <path d="M842 450 C 914 312, 1052 342, 1082 252 C 1112 162, 1036 102, 1096 18"/>
    <path d="M886 460 C 956 318, 1088 348, 1118 258 C 1148 168, 1074 108, 1134 22"/>
    <path d="M930 470 C 998 324, 1124 354, 1154 264 C 1184 174, 1112 114, 1172 26"/>
    <path d="M720 420 C 786 288, 944 318, 974 234 C 1000 158, 928 96, 984 6"/>
  </g>

  <!-- grid -->
  <g stroke="#8FA3BF" stroke-width="1" opacity="0.05">
    <path d="M0 80 H1280 M0 160 H1280 M0 240 H1280 M0 320 H1280 M0 400 H1280 M0 480 H1280 M0 560 H1280"/>
    <path d="M160 0 V640 M320 0 V640 M480 0 V640 M640 0 V640 M800 0 V640 M960 0 V640 M1120 0 V640"/>
  </g>

  <!-- mark: route to a waypoint -->
  <g transform="translate(88 252)">
    <path d="M4 96 C 22 96, 30 78, 44 66 S 70 34, 92 26" stroke="#E8623C" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9" opacity="0.75"/>
    <circle cx="4" cy="96" r="6" fill="#0B0D11" stroke="#E8623C" stroke-width="3"/>
    <circle cx="100" cy="20" r="25" fill="none" stroke="url(#trail)" stroke-width="3"/>
    <circle cx="100" cy="20" r="11" fill="url(#trail)"/>
    <path d="M100 -6 V-22" stroke="#E8623C" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(226 270)">
    <text x="0" y="0" font-family="Inter, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="82" font-weight="600" letter-spacing="-3.5" fill="url(#ink)">waymark</text>
    <text x="4" y="52" font-family="Inter, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="28" font-weight="400" letter-spacing="0.2" fill="#8B94A3">Local-first work tracking for humans and agents.</text>
  </g>

  <!-- meta row -->
  <g transform="translate(226 388)" font-family="Inter, 'Segoe UI', 'DejaVu Sans', sans-serif" font-size="16" font-weight="500">
    <rect x="0" y="0" width="112" height="36" rx="18" fill="#151A22" stroke="#232C3A"/>
    <text x="56" y="24" fill="#A8B4C6" text-anchor="middle">local-first</text>
    <rect x="124" y="0" width="122" height="36" rx="18" fill="#151A22" stroke="#232C3A"/>
    <text x="185" y="24" fill="#A8B4C6" text-anchor="middle">git-friendly</text>
    <rect x="258" y="0" width="86" height="36" rx="18" fill="#151A22" stroke="#232C3A"/>
    <text x="301" y="24" fill="#A8B4C6" text-anchor="middle">agent-ready</text>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="639" rx="0" stroke="#1A2130"/>
</svg>
